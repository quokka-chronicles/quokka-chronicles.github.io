<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Pathway book style collection of stories about a quokka.">
    
    <!-- Page Title -->
    <title>Quokka Chronicles</title>

    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="./css/style.css">

    <!-- Scripts -->
    <script src="./js/i18n.js" defer></script>
    <script src="./js/script.js" defer></script>
</head>
<body class="light-theme">

    <div class="body-content">
        <div class="left-content">
            
            <header class="site-header">
                <div class="logo-container">
                    <div class="logo">qk</div>
                </div>
            </header>

        </div>
        <div class="right-content">        
            
            <nav class="main-nav">
                <span class="panel-nav">
                    <button id="btn-narratives" data-i18n="nav_narratives" class="menu-button" aria-label="Open or hide the list of stories" data-show-panel-id="narratives-panel">
                        Narratives
                    </button>
                    <button 
                        id="btn-theme" 
                        data-i18n="nav_nocturne" 
                        data-i18n-attr="data-light-word:theme_dark_word" 
                        class="menu-button" 
                        aria-label="Toggle color theme" 
                        data-light-word="Illumine" 
                        data-dark-word="Nocturne"
                    >
                        Nocturne
                    </button>
                    <button id="btn-provenance" data-i18n="nav_provenance" class="menu-button" aria-label="Show information about the project" data-show-panel-id="about-panel">
                        Provenance
                    </button>
                    <button id="btn-lingua" data-i18n="nav_lingua" class="menu-button" aria-label="Swap language" data-show-panel-id="lingua-panel">
                        Lingua
                    </button>
                    <button id="btn-custom-variables" data-i18n="nav_character" class="menu-button" hidden data-show-panel-id="preferences-panel">
                        Character
                    </button>
                </span>
            </nav>

            <main id="reading-panel" class="scrollable-area">
                <article data-i18n="loading" class="chapter">
                    Loading, please wait...
                </article>
            </main>

        </div>
    </div>

    <aside id="narratives-panel" class="modal-panel">
        Narratives
    </aside>

    <aside id="lingua-panel" class="modal-panel">
        <button data-lang="en">EN</button>
        <button data-lang="sk">SK</button>
    </aside>

    <aside id="preferences-panel" class="modal-panel">
        <h2 data-i18n="nav_character">Preferences</h2>
        <div id="preferences-list"></div>
    </aside>

    <footer id="about-panel" class="modal-panel">
        <p data-i18n="provenance_title">Provenance</p>
        <p data-i18n="provenance_body">Quokka Chronicles is a personal portfolio project by Ramon,<br>designed to showcase modern front-end development<br>techniques with a focus on readability, accessibility, and minimalist design.</p>
        <p data-i18n="provenance_contact">Contact: des@chello.com</p>
    </footer>

</body>
</html>
